services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: swarm_sim
      POSTGRES_USER: swarm_sim
      POSTGRES_PASSWORD: swarm_sim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
